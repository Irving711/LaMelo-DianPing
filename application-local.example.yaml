# 复制为 application-local.yaml 并填写本地服务凭据。
# 也可以将占位符替换为本机专用值；切勿将 application-local.yaml 提交到版本库。
spring:
  datasource:
    username: ${HMDP_DB_USERNAME:root}
    password: ${HMDP_DB_PASSWORD:}
  redis:
    password: ${HMDP_REDIS_PASSWORD:}
  rabbitmq:
    username: ${HMDP_RABBITMQ_USERNAME:guest}
    password: ${HMDP_RABBITMQ_PASSWORD:guest}

hmdp:
  jwt:
    user-secret-key: ${HMDP_JWT_SECRET}
